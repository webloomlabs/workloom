# Backing services for local development.
# The app itself runs on the host via `pnpm dev`.
name: workloom-dev

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      WORKLOOM_DB_USER: workloom_app
      WORKLOOM_DB_PASSWORD: workloom_dev_password
      WORKLOOM_DB_NAME: workloom
    ports: ["5432:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/init-db.sh:/docker-entrypoint-initdb.d/10-init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Catches all outbound mail in development. Web UI on :8025.
  mailhog:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports: ["1025:1025", "8025:8025"]

  # S3-compatible object storage. Console on :9001.
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: workloom
      MINIO_ROOT_PASSWORD: workloom_dev_password
    ports: ["9000:9000", "9001:9001"]
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  minio-data:
